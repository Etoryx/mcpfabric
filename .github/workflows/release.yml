name: Release

# Fabric and NeoForge are released independently. Cut a release by pushing a tag that matches the
# mod version, prefixed by loader:
#   git tag v0.4.0 && git push origin v0.4.0                   # Fabric only
#   git tag neoforge-v0.4.0 && git push origin neoforge-v0.4.0 # NeoForge only
# This builds every supported Minecraft version of that loader, publishes them to Modrinth, and
# creates a GitHub Release with that loader's jars attached. See docs/RELEASING.md for the runbook.
on:
  push:
    tags: [ 'v*', 'neoforge-v*' ]
  # Manual fallback: lets you re-run a release from the Actions tab. Creates the tag if missing.
  workflow_dispatch:
    inputs:
      loader:
        description: 'Mod loader to release'
        type: choice
        options: [ fabric, neoforge ]
        required: true
      version:
        description: 'Version to release without the leading v (e.g. 0.2.0)'
        required: true

permissions:
  contents: write   # create the GitHub Release and (for workflow_dispatch) the tag

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish (${{ inputs.loader || (startsWith(github.ref_name, 'neoforge-') && 'neoforge' || 'fabric') }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve loader and release version
        id: v
        env:
          INPUT_LOADER: ${{ inputs.loader }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LOADER="$INPUT_LOADER"
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF_NAME" == neoforge-v* ]]; then
            LOADER=neoforge
            VERSION="${GITHUB_REF_NAME#neoforge-v}"
          else
            LOADER=fabric
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ "$LOADER" = neoforge ]; then
            echo "tag=neoforge-v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "task=NeoForge" >> "$GITHUB_OUTPUT"
            echo "name=mcpfabric ${VERSION} (NeoForge)" >> "$GITHUB_OUTPUT"
            echo "jars=mcpfabric-neoforge-*.jar" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "task=Fabric" >> "$GITHUB_OUTPUT"
            echo "name=mcpfabric ${VERSION}" >> "$GITHUB_OUTPUT"
            echo "jars=mcpfabric-[0-9]*.jar" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches gradle.properties
        run: |
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$MOD_VERSION" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::Release version '${{ steps.v.outputs.version }}' does not match mod_version='$MOD_VERSION' in gradle.properties. Bump mod_version (and CHANGELOG.md) before tagging."
            exit 1
          fi

      - name: Set up JDKs (21 for 1.21.x, 25 for 26.x)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Verify Modrinth publishing is configured
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "${MODRINTH_TOKEN:-}" ]; then
            echo "::error::MODRINTH_TOKEN is not configured. Refusing to create a partial release."
            exit 1
          fi
          if grep -Eq '^modrinth_id=(CHANGEME|YOUR_ID_OR_SLUG)?$' gradle.properties; then
            echo "::error::modrinth_id is not configured in gradle.properties."
            exit 1
          fi

      - name: Build every supported Minecraft version of the loader
        # The daemon runs on JDK 25 (last setup-java entry); point Gradle at both JDKs so the 1.21.x
        # compile toolchain (21) is found without re-downloading it via the foojay resolver.
        run: ./gradlew build${{ steps.v.outputs.task }} --stacktrace -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Publish the loader's versions to Modrinth
        run: ./gradlew publish${{ steps.v.outputs.task }} --stacktrace -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      # action-gh-release v3 no longer supports `!` exclusion globs, so stage this loader's mod jars
      # (without the -sources jars) in one directory and attach that.
      - name: Collect release jars
        run: |
          mkdir -p release-jars
          cp versions/*/build/libs/${{ steps.v.outputs.jars }} release-jars/
          rm -f release-jars/*-sources.jar
          ls -1 release-jars

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ steps.v.outputs.name }}
          tag_name: ${{ steps.v.outputs.tag }}
          files: release-jars/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tag a pre-release when the version carries a suffix (e.g. 0.2.0-beta.1, 0.3.0-rc.1).
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
