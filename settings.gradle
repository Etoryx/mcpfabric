pluginManagement {
	repositories {
		mavenCentral()
		gradlePluginPortal()
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'KikuGie Releases'
			url = 'https://maven.kikugie.dev/releases'
		}
		maven {
			name = 'KikuGie Snapshots'
			url = 'https://maven.kikugie.dev/snapshots'
		}
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.8'
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

stonecutter {
	create(rootProject) {
		// One node per shipped Minecraft version and loader. Source is shared; per-version API
		// differences are handled with Stonecutter //? comments. Each node reads its Minecraft /
		// loader versions from versions/<node>/gradle.properties.
		// Fabric nodes are named after the Minecraft version and built by build.gradle.
		versions(
			'1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5',
			'1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10',
			'1.21.11', '26.1.2', '26.2', '26.3'
		)
		// NeoForge nodes are named <minecraft>-neoforge and built by build.neoforge.gradle. 1.21.2 is
		// skipped: NeoForge only published two abandoned betas for it before moving to 1.21.3.
		[
			'1.21.1', '1.21.3', '1.21.4', '1.21.5', '1.21.6',
			'1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11',
			'26.1.2', '26.2', '26.3'
		].each { mc -> version("${mc}-neoforge".toString(), mc).buildscript('build.neoforge.gradle') }
		vcsVersion = '1.21.8'
	}
}

rootProject.name = 'mcpfabric'
